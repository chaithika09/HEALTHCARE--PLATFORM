name: e2e.yml

o:
  push:
    brches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  selenium_tests:
    name: "🌐 Selenium Web Tests (450)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - run: |
          cd selenium-tests
          mkdir -p reports/output reports/json reports/html
          npm install --ignore-scripts || true
          node tests/e2e-runner.js || true
          node reports/excel-report.js || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "selenium-web-report"
          path: "selenium-tests/reports/output/"

  appium_tests:
